<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Roys Wanimbo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-dark text-white">
    <div class="container mt-5">
        <h1><i class="fas fa-envelope"></i> Kontak</h1>
        <p>Hubungi saya melalui:</p>
        <ul class="list-unstyled">
            <li><i class="fab fa-facebook text-primary"></i> <a href="#" class="text-white">Facebook</a></li>
            <li><i class="fab fa-instagram text-danger"></i> <a href="#" class="text-white">Instagram</a></li>
            <li><i class="fab fa-github text-info"></i> <a href="#" class="text-white">GitHub</a></li>
        </ul>

        <!-- Kontak -->
        <section id="kontak" class="py-5 bg-white">
            <div class="container">
                <h2 class="fw-bold mb-4 text-center"><i class="fas fa-envelope"></i> Kontak</h2>
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <form>
                            <div class="mb-3">
                                <label for="nama" class="form-label">Nama Lengkap</label>
                                <input type="text" class="form-control" id="nama" placeholder="Masukkan nama Anda">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Alamat Email</label>
                                <input type="email" class="form-control" id="email" placeholder="nama@email.com">
                            </div>
                            <div class="mb-3">
                                <label for="pesan" class="form-label">Pesan</label>
                                <textarea class="form-control" id="pesan" rows="4"
                                    placeholder="Tulis pesan Anda..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-paper-plane"></i> Kirim
                                Pesan</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <a href="index.html" class="btn btn-primary mt-3"><i class="fas fa-home"></i> Kembali ke Beranda</a>
    </div>

</body>

</html>
